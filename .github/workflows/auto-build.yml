name: Auto Build & Push ATM10 (Only on new version)

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten
  workflow_dispatch: {}       # manuell startbar

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Extract version from Dockerfile
        id: version
        run: |
          VERSION=$(grep -oP 'LABEL version="\K[^"]+' Dockerfile)
          echo "atm=$VERSION" >> $GITHUB_OUTPUT
          echo "Local version: $VERSION"

      - name: Check remote version from Docker Hub
        id: remote
        run: |
          REMOTE=$(curl -fs https://hub.docker.com/v2/repositories/paddygametv/docker-allthemods10/tags \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+$' \
            | sort -rV | head -n 1)

          echo "remote=$REMOTE" >> $GITHUB_OUTPUT
          echo "Remote version: $REMOTE"

      - name: Compare versions
        id: compare
        run: |
          LOCAL="${{ steps.version.outputs.atm }}"
          REMOTE="${{ steps.remote.outputs.remote }}"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "match=true" >> $GITHUB_OUTPUT
            echo "Version unchanged — skipping build."
          else
            echo "match=false" >> $GITHUB_OUTPUT
            echo "New version detected — triggering build."
          fi

      - name: Stop if version unchanged
        if: steps.compare.outputs.match == 'true'
        run: exit 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            paddygametv/docker-allthemods10:latest
            paddygametv/docker-allthemods10:${{ steps.version.outputs.atm }}

      - name: Done
        run: echo "Image built & pushed successfully."
