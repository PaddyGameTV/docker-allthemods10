name: CurseForge Auto Build

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten prüfen
  workflow_dispatch: {}

env:
  CURSEFORGE_MOD_ID: "925200"
  DOCKERHUB_REPO: "paddygametv/docker-allthemods10"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Neueste ServerFiles-Version von CurseForge holen
        id: curseforge
        run: |
          RESPONSE=$(curl -sf -H "x-api-key: ${{ secrets.CURSEFORGE_API_KEY }}" \
            "https://api.curseforge.com/v1/mods/${CURSEFORGE_MOD_ID}/files?pageSize=50")

          LATEST_FILE=$(echo "$RESPONSE" | jq -c '
            [.data[] | select(.fileName | test("^ServerFiles-.*\\.zip$"))]
            | sort_by(.fileDate) | last
          ')

          if [[ "$LATEST_FILE" == "null" || -z "$LATEST_FILE" ]]; then
            echo "Keine ServerFiles gefunden – Abbruch."
            exit 1
          fi

          VERSION=$(echo "$LATEST_FILE" | jq -r '.fileName' | sed -E 's/^ServerFiles-(.*)\.zip$/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Neueste Version laut CurseForge: $VERSION"

      - name: Prüfen ob Tag schon auf Docker Hub existiert
        id: check
        run: |
          VERSION="${{ steps.curseforge.outputs.version }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_REPO}/tags/${VERSION}/")

          if [[ "$STATUS" == "200" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION existiert schon auf Docker Hub."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION ist neu!"
          fi

      - name: Login to Docker Hub
        if: steps.check.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ steps.curseforge.outputs.version }}
